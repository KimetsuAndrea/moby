name: X6876 Kernel Config Audit

on:
  workflow_dispatch:
    inputs:
      device_config:
        description: "X6876 device configuration"
        required: true
        type: choice
        default: x6876_h786_defconfig
        options:
          - x6876_h786_defconfig
          - x6876_h786_nonfc_defconfig

permissions:
  contents: read

concurrency:
  group: x6876-kernel-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    name: Generate X6876 kernel .config
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      COMMON_URL: https://d1wd32b69guoqm.cloudfront.net/opensource/android15_kernel_common_mt6878.tar.gz
      MODULES_URL: https://d1wd32b69guoqm.cloudfront.net/opensource/android15_kernel_modules_and_devicetree_mt6878.tar.gz
      WORK_DIR: ${{ github.workspace }}/.kernel-work
      OUT_DIR: ${{ github.workspace }}/.kernel-work/out

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install configuration tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ca-certificates clang curl flex \
            libelf-dev libssl-dev lld python3 rsync tar xz-utils

      - name: Download official Infinix sources
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/common" "$WORK_DIR/modules" "$OUT_DIR"

          curl --fail --location --retry 3 \
            "$COMMON_URL" -o "$WORK_DIR/common.tar.gz"
          curl --fail --location --retry 3 \
            "$MODULES_URL" -o "$WORK_DIR/modules.tar.gz"

          ls -lh "$WORK_DIR/common.tar.gz" "$WORK_DIR/modules.tar.gz"

      - name: Extract source archives
        run: |
          set -euo pipefail

          tar -xzf "$WORK_DIR/common.tar.gz" -C "$WORK_DIR/common"
          # Extract the complete device-module tree: Kconfig.ext and device
          # Kconfig files can include dependencies outside the X6876 folder.
          tar -xzf "$WORK_DIR/modules.tar.gz" -C "$WORK_DIR/modules"

          KERNEL="$(find "$WORK_DIR/common" -type f \
            -path '*/kernel-6.1/Makefile' -print -quit)"
          MODULES="$(find "$WORK_DIR/modules" -type d \
            -name kernel_device_modules-6.1 -print -quit)"

          if [[ -z "$KERNEL" || ! -f "$KERNEL" ]]; then
            echo "::error::Could not locate common kernel Makefile."
            exit 1
          fi
          if [[ -z "$MODULES" || ! -d "$MODULES" ]]; then
            echo "::error::Could not locate kernel_device_modules-6.1."
            exit 1
          fi

          KERNEL="${KERNEL%/Makefile}"
          {
            echo "KERNEL=$KERNEL"
            echo "MODULES=$MODULES"
          } >> "$GITHUB_ENV"

          echo "Kernel source: $KERNEL"
          echo "Device modules: $MODULES"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' "$KERNEL/Makefile"

      - name: Validate X6876 configuration inputs
        env:
          DEVICE_CONFIG_NAME: ${{ inputs.device_config }}
        run: |
          set -euo pipefail

          BASE_DEFCONFIG="$MODULES/arch/arm64/configs/mgk_64_k61_defconfig"
          DEVICE_CONFIG="$MODULES/kernel/configs/$DEVICE_CONFIG_NAME"

          [[ -f "$BASE_DEFCONFIG" ]] || {
            echo "::error::Missing MTK base defconfig: $BASE_DEFCONFIG"
            exit 1
          }
          [[ -f "$DEVICE_CONFIG" ]] || {
            echo "::error::Missing X6876 device config: $DEVICE_CONFIG"
            exit 1
          }
          [[ -f "$MODULES/Kconfig.ext" ]] || {
            echo "::error::Missing Kconfig.ext."
            exit 1
          }

          {
            echo "BASE_DEFCONFIG=$BASE_DEFCONFIG"
            echo "DEVICE_CONFIG=$DEVICE_CONFIG"
          } >> "$GITHUB_ENV"

          echo "Base defconfig: $BASE_DEFCONFIG"
          echo "Device config: $DEVICE_CONFIG"
          echo "Device config preview:"
          sed -n '1,160p' "$DEVICE_CONFIG"

      - name: Collect Infinix vendor build recipe
        env:
          DEVICE_CONFIG_NAME: ${{ inputs.device_config }}
        run: |
          set -euo pipefail

          RECIPE="$GITHUB_WORKSPACE/vendor-build-recipe"
          mkdir -p "$RECIPE"

          # Keep paths relative to the two source roots. Do not use cp --parents
          # with absolute paths: that preserves the hidden .kernel-work segment,
          # which actions/upload-artifact excludes by default.
          copy_into_recipe() {
            local source_root="$1"
            local label="$2"
            local source="$3"
            [[ -f "$source" ]] || return 0
            local relative_path="${source#"$source_root"/}"
            local destination="$RECIPE/$label/$relative_path"
            mkdir -p "$(dirname "$destination")"
            cp "$source" "$destination"
          }

          copy_into_recipe "$KERNEL" common "$KERNEL/Makefile"
          copy_into_recipe "$KERNEL" common "$KERNEL/arch/arm64/configs/gki_defconfig"
          copy_into_recipe "$KERNEL" common "$KERNEL/arch/arm64/configs/defconfig"
          copy_into_recipe "$MODULES" modules "$MODULES/Makefile"
          copy_into_recipe "$MODULES" modules "$MODULES/Kconfig.ext"
          copy_into_recipe "$MODULES" modules "$MODULES/arch/arm64/configs/mgk_64_k61_defconfig"
          copy_into_recipe "$MODULES" modules "$MODULES/kernel/configs/$DEVICE_CONFIG_NAME"

          # Vendor build scripts/configs may live at different levels in
          # this source drop. Capture them with paths relative to MODULES.
          while IFS= read -r -d '' file; do
            copy_into_recipe "$MODULES" modules "$file"
          done < <(
            find "$MODULES" -type f \( \
              -name 'build.config*' -o -name 'build.sh' -o \
              -name 'legacy_build.sh' -o -name '*defconfig*' \) -print0
          )

          # Keep the common-tree defconfigs in their own non-hidden subtree.
          while IFS= read -r -d '' file; do
            copy_into_recipe "$KERNEL" common "$file"
          done < <(
            find "$KERNEL/arch/arm64/configs" -maxdepth 1 -type f \( \
              -name '*defconfig*' -o -name 'defconfig' \) -print0
          )

          # Capture the missing orchestration files needed to reproduce the
          # vendor's own config-generation path, not just its config fragments.
          while IFS= read -r -d '' file; do
            copy_into_recipe "$MODULES" modules "$file"
          done < <(
            find "$MODULES" -type f \( \
              -path '*/kernel/kleaf/*' -o \
              -path '*/scripts/*.py' \
            \) -print0
          )

          while IFS= read -r -d '' file; do
            copy_into_recipe "$KERNEL" common "$file"
          done < <(
            find "$KERNEL" -maxdepth 2 -type f -name 'build.config*' -print0
          )

          # The MTK project is Kleaf-supported, so its real config path is
          # described by Bazel BUILD files and .bzl rules, not only the
          # legacy build-config generator. Capture the narrowly relevant
          # Kleaf graph and config fragments for offline inspection.
          for relative_dir in \
            "kernel/kleaf" \
            "kernel/configs" \
            "arch/arm64"; do
            search_root="$MODULES/$relative_dir"
            [[ -d "$search_root" ]] || continue
            while IFS= read -r -d '' file; do
              copy_into_recipe "$MODULES" modules "$file"
            done < <(
              find "$search_root" -type f \( \
                -name 'BUILD' -o -name 'BUILD.bazel' -o \
                -name '*.bzl' -o -name '*.config' \
              \) -print0
            )
          done

          for relative_dir in \
            "build/kernel/kleaf" \
            "arch/arm64/kleaf"; do
            search_root="$KERNEL/$relative_dir"
            [[ -d "$search_root" ]] || continue
            while IFS= read -r -d '' file; do
              copy_into_recipe "$KERNEL" common "$file"
            done < <(
              find "$search_root" -type f \( \
                -name 'BUILD' -o -name 'BUILD.bazel' -o \
                -name '*.bzl' -o -name '*.config' \
              \) -print0
            )
          done

          # Root BUILD files often define the @mgk_info repository used by
          # Kleaf's project rules; keep these alongside the module recipe.
          for file in "$MODULES/BUILD" "$MODULES/BUILD.bazel" "$KERNEL/BUILD" "$KERNEL/BUILD.bazel"; do
            [[ ! -f "$file" ]] || copy_into_recipe "${file%/*}" \
              "$([[ "$file" == "$MODULES/"* ]] && echo modules || echo common)" "$file"
          done

          if [[ -d "$KERNEL/build" ]]; then
            while IFS= read -r -d '' file; do
              copy_into_recipe "$KERNEL" common "$file"
            done < <(
              find "$KERNEL/build" -maxdepth 2 -type f \( \
                -name '*.sh' -o -name '*.py' \
              \) -print0
            )
          fi

          # Capture Bazel workspace metadata and repository-rule inputs.
          for source_root in "$WORK_DIR/common" "$WORK_DIR/modules"; do
            [[ -d "$source_root" ]] || continue
            while IFS= read -r -d "" file; do
              label=modules
              [[ "$file" == "$WORK_DIR/common/"* ]] && label=common
              copy_into_recipe "$WORK_DIR" "$label" "$file"
            done < <(
              find "$source_root" -maxdepth 5 -type f \(
                -name WORKSPACE -o -name WORKSPACE.bazel -o
                -name MODULE.bazel -o -name .bazelrc -o -name REPO.bazel
              \) -print0
            )
          done

          # Capture the missing MTK Bazel rule implementation.
          for source_root in "$KERNEL" "$MODULES"; do
            for relative_dir in build/bazel_mgk_rules build/kernel/kleaf; do
              search_root="$source_root/$relative_dir"
              [[ -d "$search_root" ]] || continue
              label=modules
              [[ "$source_root" == "$KERNEL" ]] && label=common
              while IFS= read -r -d "" file; do
                copy_into_recipe "$source_root" "$label" "$file"
              done < <(
                find "$search_root" -type f \(
                  -name BUILD -o -name BUILD.bazel -o -name "*.bzl" -o
                  -name "*.py" -o -name "*.sh"
                \) -print0
              )
            done
          done

          # Find declarations and generators for @mgk_info and overlays.
          while IFS= read -r -d "" file; do
            label=modules
            [[ "$file" == "$WORK_DIR/common/"* ]] && label=common
            copy_into_recipe "$WORK_DIR" "$label" "$file"
          done < <(
            grep -RIlE --exclude="*.ko" --exclude="*.o" --exclude="*.a" \
              --exclude="*.so" --exclude="*.gz" --exclude="*.tar*" \
              "mgk_info|DEFCONFIG_OVERLAYS" "$WORK_DIR/common" "$WORK_DIR/modules" \
              2>/dev/null | tr "\n" "\0"
          )
          {
            echo "Vendor build recipe collection"
            echo "=============================="
            echo "Kernel: $KERNEL"
            echo "Modules: $MODULES"
            echo
            echo "Collected files:"
            find "$RECIPE" -type f -printf '%P\n' | sort
          } > "$GITHUB_WORKSPACE/vendor-build-recipe-manifest.txt"

          # Highlight references that determine the actual config merge path.
          grep -RniE 'DEFCONFIG_OVERLAYS|KCONFIG_EXT_PREFIX|KERNEL_DEFCONFIG|defconfig|olddefconfig|merge_config|make.*(Image|modules)' \
            "$RECIPE" > "$GITHUB_WORKSPACE/vendor-build-recipe-hints.txt" || true

          cat "$GITHUB_WORKSPACE/vendor-build-recipe-manifest.txt"
          echo
          echo "Build-recipe hints:"
          sed -n '1,240p' "$GITHUB_WORKSPACE/vendor-build-recipe-hints.txt" || true

      - name: Trace vendor Kleaf configuration path
        run: |
          set -euo pipefail
          REPORT="$WORK_DIR/vendor-kleaf-trace.txt"
          {
            echo "Infinix X6876 Kleaf configuration trace"
            echo "======================================"
            echo "Kernel source: $KERNEL"
            echo "Device modules: $MODULES"
            echo
            echo "IMPORTANT: This workflow intentionally does not generate a .config."
            echo "The previous manual make/merge path was not the vendor Kleaf path"
            echo "and produced a misleading config; do not treat it as stock."
            echo
            echo "Bazel workspace metadata:"
            find "$WORK_DIR/common" "$WORK_DIR/modules" -maxdepth 5 -type f \(
              -name WORKSPACE -o -name WORKSPACE.bazel -o -name MODULE.bazel -o
              -name .bazelrc -o -name REPO.bazel \) -print 2>/dev/null | sort
            echo
            echo "Collected Kleaf and MTK Bazel rule files:"
            find "$RECIPE" -type f \(
              -path "*/build/bazel_mgk_rules/*" -o -path "*/kernel/kleaf/*" \) -print | sort
            echo
            echo "mgk_info / DEFCONFIG_OVERLAYS references:"
            grep -RniE "mgk_info|DEFCONFIG_OVERLAYS" "$RECIPE" || true
            echo
            echo "Config generation and kernel rule references:"
            grep -RniE "define_mgk|kernel_build|kernel_config|defconfig|olddefconfig|merge_config|config_fragments" \
              "$RECIPE" --include="*.bzl" --include=BUILD --include=BUILD.bazel \
              --include="*.sh" --include="*.py" || true
          } > "$REPORT"
          cat "$REPORT"
          cp "$REPORT" "$WORK_DIR/"

      - name: Upload vendor build recipe and Kleaf trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x6876-kernel-config-${{ inputs.device_config }}
          path: |
            ${{ github.workspace }}/.kernel-work/vendor-kleaf-trace.txt
            ${{ github.workspace }}/vendor-build-recipe/
            ${{ github.workspace }}/vendor-build-recipe-manifest.txt
            ${{ github.workspace }}/vendor-build-recipe-hints.txt
          if-no-files-found: error
          retention-days: 14
