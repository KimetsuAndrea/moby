
name: Infinix X6876 - Kernel Config Inspector

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: Kernel defconfig to inspect
        required: true
        default: mgk_64_k61_defconfig
        type: string

permissions:
  contents: read

jobs:
  configure:
    name: Generate ARM64 kernel configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install configuration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            libelf-dev \
            libssl-dev \
            lld \
            python3 \
            rsync

      - name: Download official Infinix kernel sources
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/mt6878/common"
          mkdir -p "$RUNNER_TEMP/mt6878/modules"
          mkdir -p "$RUNNER_TEMP/mt6878/reports"

          curl -fL --retry 5 \
            "https://d1wd32b69guoqm.cloudfront.net/opensource/android15_kernel_common_mt6878.tar.gz" \
            -o "$RUNNER_TEMP/common.tar.gz"

          curl -fL --retry 5 \
            "https://d1wd32b69guoqm.cloudfront.net/opensource/android15_kernel_modules_and_devicetree_mt6878.tar.gz" \
            -o "$RUNNER_TEMP/modules.tar.gz"

          tar -xzf "$RUNNER_TEMP/common.tar.gz" \
            -C "$RUNNER_TEMP/mt6878/common"

          rm "$RUNNER_TEMP/common.tar.gz"

          # Extract the device-module Kconfig and build metadata.
          # Avoid extracting the entire 1.66 GB compressed archive.
          tar -tzf "$RUNNER_TEMP/modules.tar.gz" \
            | grep -E 'kernel_device_modules-6\.1/.*(Kconfig[^/]*|build\.sh|build\.config[^/]*|[^/]*defconfig|[^/]*\.fragment|[^/]*\.cfg)$' \
            > "$RUNNER_TEMP/module-files.txt" || true

          if [ ! -s "$RUNNER_TEMP/module-files.txt" ]; then
            echo "ERROR: Could not find device-module configuration files."
            exit 1
          fi

          tar -xzf "$RUNNER_TEMP/modules.tar.gz" \
            -C "$RUNNER_TEMP/mt6878/modules" \
            -T "$RUNNER_TEMP/module-files.txt"

          rm "$RUNNER_TEMP/modules.tar.gz"

      - name: Locate kernel source and device modules
        shell: bash
        run: |
          set -euo pipefail

          KERNEL="$(find "$RUNNER_TEMP/mt6878/common" \
            -type f -path '*/kernel-6.1/Makefile' \
            -print -quit | xargs dirname)"

          MODULES="$(find "$RUNNER_TEMP/mt6878/modules" \
            -type d -name kernel_device_modules-6.1 \
            -print -quit)"

          if [ -z "$KERNEL" ] || [ -z "$MODULES" ]; then
            echo "ERROR: Could not locate kernel or device modules."
            exit 1
          fi

          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
          echo "MODULES=$MODULES" >> "$GITHUB_ENV"

          echo "Kernel source: $KERNEL"
          echo "Device modules: $MODULES"

          echo "=== Kernel version ==="
          head -n 5 "$KERNEL/Makefile"

          echo "=== Device-module build metadata ==="
          find "$MODULES" -maxdepth 3 \
            -type f \( -name 'build.sh' -o -name 'build.config*' -o -name 'Kconfig.ext' \) \
            -print

      - name: Discover build configuration
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/mt6878/reports"

          {
            echo "=== Defconfig files ==="
            find "$KERNEL/arch/arm64/configs" "$MODULES" \
              -type f \( -name '*defconfig' -o -name '*.fragment' -o -name '*.cfg' \) \
              -print 2>/dev/null || true

            echo
            echo "=== Build configuration references ==="

            grep -RInE \
              'DEFCONFIG|KCONFIG_EXT_PREFIX|FRAGMENT_CONFIG|BUILD_CONFIG|KERNEL_CONFIG|MAKE_GOALS|KLEAF|bazel' \
              "$KERNEL/build" "$MODULES" \
              --include='*.sh' \
              --include='build.config*' \
              --include='*.mk' \
              2>/dev/null | head -n 500 || true

            echo
            echo "=== X6876 device trees ==="

            find "$MODULES" -type f \
              \( -name 'x6876_h786.dts' -o -name 'x6876_h786_nonfc.dts' \) \
              -print
          } > "$REPORT/source-build-hints.txt"

      - name: Prepare requested defconfig
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="${{ inputs.defconfig }}"

          if [[ "$DEFCONFIG" != *.defconfig ]]; then
            echo "ERROR: Expected a defconfig filename."
            exit 1
          fi

          CONFIG_DIR="$KERNEL/arch/arm64/configs"

          # Some MediaTek releases keep device defconfigs
          # outside the common kernel tree.
          if [ ! -f "$CONFIG_DIR/$DEFCONFIG" ]; then
            FOUND="$(find "$MODULES" -type f \
              -name "$DEFCONFIG" -print -quit)"

            if [ -n "$FOUND" ]; then
              echo "Found device defconfig: $FOUND"
              cp "$FOUND" "$CONFIG_DIR/$DEFCONFIG"
            fi
          fi

          if [ ! -f "$CONFIG_DIR/$DEFCONFIG" ]; then
            echo "ERROR: $DEFCONFIG not found."
            echo "Check source-build-hints.txt."
            exit 1
          fi

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"

      - name: Generate final configuration for selected defconfig
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/mt6878/out"
          REPORT="$RUNNER_TEMP/mt6878/reports"

          mkdir -p "$OUT"

          echo "=== Running $DEFCONFIG ==="

          make -C "$KERNEL" \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            KCONFIG_EXT_PREFIX="$MODULES/" \
            "$DEFCONFIG" \
            2>&1 | tee "$REPORT/defconfig.log"

          echo "=== Resolving Kconfig dependencies ==="

          make -C "$KERNEL" \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            KCONFIG_EXT_PREFIX="$MODULES/" \
            olddefconfig \
            2>&1 | tee "$REPORT/olddefconfig.log"

          if [ ! -s "$OUT/.config" ]; then
            echo "ERROR: .config was not generated."
            exit 1
          fi

          cp "$OUT/.config" "$REPORT/x6876-kernel.config"

          echo "Configuration generated successfully."

      - name: Extract networking and nftables configuration
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/mt6878/reports"
          CONFIG="$REPORT/x6876-kernel.config"

          if [ ! -f "$CONFIG" ]; then
            echo "No generated .config available."
            exit 0
          fi

          grep -E \
            '^(CONFIG_(NETFILTER|NF_|NFT_|IP_NF|IP6_NF|BRIDGE_NETFILTER|NETFILTER_XT)[A-Z0-9_]*=|# CONFIG_(NETFILTER|NF_|NFT_|IP_NF|IP6_NF|BRIDGE_NETFILTER|NETFILTER_XT)[A-Z0-9_]* is not set)' \
            "$CONFIG" \
            > "$REPORT/netfilter-config.txt" || true

          echo "=== Netfilter configuration ==="
          cat "$REPORT/netfilter-config.txt"

          echo
          echo "=== Kernel release ==="
          make -s -C "$KERNEL" O="$RUNNER_TEMP/mt6878/out" \
            ARCH=arm64 kernelrelease \
            > "$REPORT/kernel-release.txt" 2>&1 || true

      - name: Upload kernel configuration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X6876-Kernel-Configuration
          path: |
            ${{ runner.temp }}/mt6878/reports/
          if-no-files-found: warn
          retention-days: 14
