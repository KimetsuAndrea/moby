
name: Build nftables for Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            bison \
            flex \
            gettext \
            autopoint \
            xz-utils \
            bzip2 \
            curl \
            unzip \
            zip \
            file

      - name: Install Android NDK
        run: |
          curl -L \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip \
            -o ndk.zip
          unzip -q ndk.zip
          echo "NDK=$PWD/android-ndk-r30" >> "$GITHUB_ENV"

      - name: Build Android ARM64 nft
        shell: bash
        run: |
          set -euxo pipefail

          API=29
          TOOL="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CC="$TOOL/aarch64-linux-android${API}-clang"
          export AR="$TOOL/llvm-ar"
          export RANLIB="$TOOL/llvm-ranlib"
          export STRIP="$TOOL/llvm-strip"

          export CFLAGS="-O2 -fPIC"
          export CPPFLAGS=""
          export LDFLAGS=""

          export HOST="aarch64-linux-android"
          export PREFIX="$PWD/android-prefix"

          mkdir -p "$PREFIX"

          # Build libmnl
          curl -fL \
            https://netfilter.org/projects/libmnl/files/libmnl-1.0.5.tar.bz2 \
            -o libmnl.tar.bz2

          tar -xf libmnl.tar.bz2
          cd libmnl-1.0.5

          ./configure \
            --host="$HOST" \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static

          make -j2
          make install
          cd ..

          # Build libnftnl
          curl -fL \
            https://netfilter.org/projects/libnftnl/files/libnftnl-1.3.2.tar.xz \
            -o libnftnl.tar.xz

          tar -xf libnftnl.tar.xz
          cd libnftnl-1.3.2

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_ALLOW_CROSS=1

          ./configure \
            --host="$HOST" \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static

          make -j2
          make install
          cd ..

          # Build nftables
          curl -fL \
            https://netfilter.org/projects/nftables/files/nftables-1.1.7.tar.xz \
            -o nftables.tar.xz

          tar -xf nftables.tar.xz
          cd nftables-1.1.7

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_ALLOW_CROSS=1

          ./configure \
            --host="$HOST" \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static \
            --disable-man-doc \
            --with-mini-gmp \
            --without-cli \
            --without-json \
            --without-xtables \

          make -j2
          make install
          cd ..

          # Find the installed executable
          NFT="$(find "$PREFIX" -type f -name nft -perm /111 | head -n 1)"

          test -n "$NFT"
          mkdir -p module/system/bin
          cp "$NFT" module/system/bin/nft

          # Strip debug symbols
          "$STRIP" --strip-unneeded module/system/bin/nft

          chmod 755 module/system/bin/nft

          # Verify architecture and Android linker
          file module/system/bin/nft
          "$TOOL/llvm-readelf" -h module/system/bin/nft
          "$TOOL/llvm-readelf" -l module/system/bin/nft
          "$TOOL/llvm-readelf" -d module/system/bin/nft

          # Ensure libmnl and libnftnl are not dynamic dependencies
          if "$TOOL/llvm-readelf" -d module/system/bin/nft | grep -E 'libmnl|libnftnl'; then
            echo "Unexpected dynamic Netfilter library dependency"
            exit 1
          fi

          # KernelSU module metadata
          cat > module/module.prop <<'EOF'
          id=nftables_android_arm64
          name=Android ARM64 nftables
          version=1.1.7
          versionCode=1107
          author=Custom Android Build
          description=Android Bionic ARM64 nft userspace binary
          EOF

          # Package installable module
          cd module
          zip -r ../nftables-android-arm64.zip .
          cd ..

          ls -lh nftables-android-arm64.zip

      - name: Upload KernelSU module
        uses: actions/upload-artifact@v4
        with:
          name: nftables-android-arm64
          path: nftables-android-arm64.zip
          if-no-files-found: error
