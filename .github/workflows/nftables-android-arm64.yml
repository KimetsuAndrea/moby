
name: Build nftables for Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android ARM64 nft
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: r30
      API: 29
      HOST: aarch64-linux-android
      PREFIX: ${{ github.workspace }}/android-prefix

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            bison \
            flex \
            gettext \
            autopoint \
            xz-utils \
            bzip2 \
            curl \
            unzip \
            zip \
            file \
            python3

      - name: Download Android NDK r30
        run: |
          curl -fL \
            https://dl.google.com/android/repository/android-ndk-r30-linux.zip \
            -o android-ndk.zip

          unzip -q android-ndk.zip
          rm android-ndk.zip

          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r30" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$GITHUB_WORKSPACE/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"

      - name: Configure Android cross compiler
        run: |
          echo "$GITHUB_WORKSPACE/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

          echo "CC=$GITHUB_WORKSPACE/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API}-clang" >> "$GITHUB_ENV"
          echo "AR=$GITHUB_WORKSPACE/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$GITHUB_WORKSPACE/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$GITHUB_WORKSPACE/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" >> "$GITHUB_ENV"
          echo "SYSROOT=$GITHUB_WORKSPACE/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> "$GITHUB_ENV"

          mkdir -p "$PREFIX"

      - name: Build libmnl 1.0.5
        run: |
          curl -fL \
            https://netfilter.org/projects/libmnl/files/libmnl-1.0.5.tar.bz2 \
            -o libmnl.tar.bz2

          tar -xf libmnl.tar.bz2
          cd libmnl-1.0.5

          ./configure \
            --host="$HOST" \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static

          make -j2
          make install

      - name: Build libnftnl 1.3.2
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/android-prefix/lib/pkgconfig
        run: |
          curl -fL \
            https://netfilter.org/projects/libnftnl/files/libnftnl-1.3.2.tar.xz \
            -o libnftnl.tar.xz

          tar -xf libnftnl.tar.xz
          cd libnftnl-1.3.2

          ./configure \
            --host="$HOST" \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static

          make -j2
          make install

      - name: Download nftables 1.1.7
        run: |
          curl -fL \
            https://netfilter.org/projects/nftables/files/nftables-1.1.7.tar.xz \
            -o nftables.tar.xz

          tar -xf nftables.tar.xz

      - name: Patch nftables Android IPv6 compatibility
        working-directory: nftables-1.1.7
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Fix duplicate ipv6hdr definition.
          header = Path("include/headers.h")
          text = header.read_text()

          if "struct ipv6hdr" not in text:
              raise SystemExit("Could not find struct ipv6hdr in headers.h")

          if "#include <linux/ipv6.h>" not in text:
              pattern = re.compile(
                  r"struct ipv6hdr\s*\{.*?\};",
                  re.S
              )

              replacement = """#ifdef __linux__
          #include <linux/ipv6.h>
          #else
          struct ipv6hdr {
              uint8_t version:4, priority:4;
              uint8_t flow_lbl[3];
              uint16_t payload_len;
              uint8_t nexthdr;
              uint8_t hop_limit;
              struct in6_addr saddr;
              struct in6_addr daddr;
          };
          #endif"""

              text, count = pattern.subn(replacement, text, count=1)

              if count != 1:
                  raise SystemExit("Failed to patch ipv6hdr definition")

              header.write_text(text)

          # Fix missing IPv6 routing-header type in Android NDK.
          source = Path("src/exthdr.c")
          text = source.read_text()

          if "struct nft_ip6_rthdr0" not in text:
              marker = re.compile(
                  r"(struct ip6_rt2_hdr\s*\{.*?\};)",
                  re.S
              )

              replacement = r"""\1

          /* Android NDK compatibility: IPv6 routing header type 0. */
          struct nft_ip6_rthdr0 {
              uint8_t ip6r0_nxt;
              uint8_t ip6r0_len;
              uint8_t ip6r0_type;
              uint8_t ip6r0_segleft;
              uint32_t ip6r0_reserved;
              struct in6_addr ip6r0_addr[1];
          };
          """

              text, count = marker.subn(replacement, text, count=1)

              if count != 1:
                  raise SystemExit("Could not insert nft_ip6_rthdr0")

          # Use the compatibility structure for RT0_FIELD.
          macro = re.compile(
              r"(#define\s+RT0_FIELD\(.*?)(struct ip6_rthdr0)(.*)",
              re.S
          )

          text, count = macro.subn(
              r"\1struct nft_ip6_rthdr0\3",
              text,
              count=1
          )

          if count != 1:
              if "struct nft_ip6_rthdr0" not in text:
                  raise SystemExit("Could not patch RT0_FIELD")
          
          source.write_text(text)

          print("IPv6 Android compatibility patches applied.")
          PY

      - name: Fix Android NDK networking symbol conflicts
        working-directory: nftables-1.1.7
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              "TCP_FLAG_FIN": "NFT_TCP_FLAG_FIN",
              "TCP_FLAG_SYN": "NFT_TCP_FLAG_SYN",
              "TCP_FLAG_RST": "NFT_TCP_FLAG_RST",
              "TCP_FLAG_PSH": "NFT_TCP_FLAG_PSH",
              "TCP_FLAG_ACK": "NFT_TCP_FLAG_ACK",
              "TCP_FLAG_URG": "NFT_TCP_FLAG_URG",
              "TCP_FLAG_CWR": "NFT_TCP_FLAG_CWR",
              "ip_auth_hdr": "nft_ip_auth_hdr",
              "ip_esp_hdr": "nft_ip_esp_hdr",
              "ip_comp_hdr": "nft_ip_comp_hdr",
          }

          suffixes = {
              ".h", ".c", ".cc", ".cpp",
              ".y", ".l", ".ll"
          }

          counts = {name: 0 for name in replacements}
          changed = 0

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue

              if ".git" in path.parts:
                  continue

              if path.suffix not in suffixes:
                  continue

              try:
                  original = path.read_text()
              except UnicodeDecodeError:
                  continue

              content = original

              for old, new in replacements.items():
                  content, count = re.subn(
                      rf"\b{re.escape(old)}\b",
                      new,
                      content
                  )
                  counts[old] += count

              if content != original:
                  path.write_text(content)
                  changed += 1

          header = Path("include/headers.h").read_text()

          required = [
              "NFT_TCP_FLAG_FIN",
              "NFT_TCP_FLAG_SYN",
              "NFT_TCP_FLAG_RST",
              "NFT_TCP_FLAG_PSH",
              "NFT_TCP_FLAG_ACK",
              "NFT_TCP_FLAG_URG",
              "NFT_TCP_FLAG_CWR",
              "struct nft_ip_auth_hdr",
              "struct nft_ip_esp_hdr",
              "struct nft_ip_comp_hdr",
          ]

          missing = [item for item in required if item not in header]

          if missing:
              raise SystemExit(
                  "Compatibility patch incomplete: "
                  + ", ".join(missing)
              )

          print("Android NDK symbol compatibility patch applied.")
          print(f"Modified files: {changed}")

          for name, count in counts.items():
              print(f"{name}: {count} replacement(s)")
          PY

      - name: Configure nftables
        working-directory: nftables-1.1.7
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/android-prefix/lib/pkgconfig
        run: |
          export CPPFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"

          ./configure \
            --host="$HOST" \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static \
            --disable-man-doc \
            --with-mini-gmp \
            --without-cli \
            --without-json \
            --without-xtables

      - name: Build nftables
        working-directory: nftables-1.1.7
        run: |
          set -o pipefail
          make -j2 2>&1 | tee ../nftables-build.log

      - name: Install nftables
        working-directory: nftables-1.1.7
        run: |
          make install

          mkdir -p "$GITHUB_WORKSPACE/output"

          NFT_BIN="$(find "$PREFIX" -type f -name nft -perm -111 | head -n 1)"

          if [ -z "$NFT_BIN" ]; then
            echo "ERROR: nft executable was not produced."
            find "$PREFIX" -maxdepth 4 -type f -print
            exit 1
          fi

          cp "$NFT_BIN" "$GITHUB_WORKSPACE/output/nft"
          chmod 0755 "$GITHUB_WORKSPACE/output/nft"

      - name: Validate Android ARM64 binary
        run: |
          set -e

          LLVM_READelf="$TOOLCHAIN/bin/llvm-readelf"

          file output/nft
          "$LLVM_READelf" -h output/nft

          "$LLVM_READelf" -h output/nft | grep -q "AArch64" || {
            echo "ERROR: Binary is not AArch64."
            exit 1
          }

          "$LLVM_READelf" -h output/nft | grep -q "DYN\|EXEC" || {
            echo "ERROR: Unexpected ELF binary type."
            exit 1
          }

          echo "Android ARM64 ELF validation passed."

      - name: Upload nft binary
        uses: actions/upload-artifact@v4
        with:
          name: nftables-android-arm64
          path: output/nft
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nftables-build-diagnostics
          path: |
            nftables-build.log
            nftables-1.1.7/config.log
          if-no-files-found: warn
