
name: Build nftables for Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            bison \
            flex \
            gettext \
            autopoint \
            xz-utils \
            bzip2 \
            curl \
            unzip \
            zip \
            file

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          NDK_VERSION=r30
          NDK_PACKAGE=android-ndk-${NDK_VERSION}-linux.zip

          curl -fL \
            "https://dl.google.com/android/repository/${NDK_PACKAGE}" \
            -o ndk.zip

          unzip -q ndk.zip

          echo "NDK=$PWD/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Android ARM64 nft
        shell: bash
        run: |
          set -euxo pipefail

          API=29
          TOOL="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CC="$TOOL/aarch64-linux-android${API}-clang"
          export AR="$TOOL/llvm-ar"
          export RANLIB="$TOOL/llvm-ranlib"
          export STRIP="$TOOL/llvm-strip"

          export CFLAGS="-O2 -fPIC"
          export CPPFLAGS=""
          export LDFLAGS=""

          export HOST="aarch64-linux-android"
          export PREFIX="$PWD/android-prefix"

          mkdir -p "$PREFIX"

          # Build libmnl
          curl -fL \
            https://netfilter.org/projects/libmnl/files/libmnl-1.0.5.tar.bz2 \
            -o libmnl.tar.bz2

          tar -xf libmnl.tar.bz2
          cd libmnl-1.0.5

          ./configure \
            --host="$HOST" \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static

          make -j2
          make install
          cd ..

          # Build libnftnl
          curl -fL \
            https://netfilter.org/projects/libnftnl/files/libnftnl-1.3.2.tar.xz \
            -o libnftnl.tar.xz

          tar -xf libnftnl.tar.xz
          cd libnftnl-1.3.2

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_ALLOW_CROSS=1

          ./configure \
            --host="$HOST" \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static

          make -j2
          make install
          cd ..

          # Download nftables
          curl -fL \
            https://netfilter.org/projects/nftables/files/nftables-1.1.7.tar.xz \
            -o nftables.tar.xz

          tar -xf nftables.tar.xz

          cd nftables-1.1.7

          # Inspect IPv6 header conflicts
          echo "===== headers.h ====="
          sed -n '1,150p' include/headers.h

          echo "===== exthdr.c ====="
          sed -n '450,495p' src/exthdr.c

          echo "===== IPv6 structure declarations ====="
          grep -R -n -E \
            'struct ipv6hdr|struct ip6_rthdr0|ip6r0_addr' \
            include src || true

          echo "===== Android NDK IPv6 header ====="
          sed -n '1,130p' \
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/linux/ipv6.h"

          echo "===== Android netinet IPv6 header ====="
          sed -n '1,130p' \
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/netinet/ip6.h"

          # Configure nftables
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_ALLOW_CROSS=1

          ./configure \
            --host="$HOST" \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static \
            --disable-man-doc \
            --with-mini-gmp \
            --without-cli \
            --without-json \
            --without-xtables

          # Stop after diagnostics until IPv6 compatibility is fixed.
          echo "IPv6 diagnostics completed. Awaiting compatibility patch."
          exit 0

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nftables-android-diagnostics
          path: |
            nftables-1.1.7/include/headers.h
            nftables-1.1.7/src/exthdr.c
            nftables-1.1.7/config.log
          if-no-files-found: warn
